name: tests

on:
  push:
  pull_request:

jobs:
  forge-test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - contracts/agent-bond
          - contracts/stream-pay
          - contracts/commit-stake
          - contracts/commit-stake-v2
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # forge-std is a pinned submodule (v1.16.1) in all four projects — see .gitmodules
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      # Full suite: unit + adversarial + fuzz (10,000 runs) + invariant (10,000 runs x depth 15)
      - name: Test
        run: forge test -vv
