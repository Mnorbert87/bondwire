name: tests

on:
  push:
  pull_request:

jobs:
  forge-test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - contracts/agent-bond
          - contracts/stream-pay
          - contracts/commit-stake
          - contracts/commit-stake-v2
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # forge-std is a pinned submodule (v1.16.1) in all four projects — see .gitmodules
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build

      # Full suite: unit + adversarial + fuzz (10,000 runs) + invariant (10,000 runs x depth 15)
      - name: Test
        run: forge test -vv

  # The SDK declares its own hand-written ABI fragments instead of importing the compiled
  # artifacts, and that copy has already rotted once: on 2026-07-29 the AgentBond `Obligation`
  # struct gained a field before `status`, the Solidity-side copy was updated and the SDK copy
  # was not, so a live locked obligation decoded as "Released". HARDENED_AUDIT_2026-07-29 said
  # this guard would be wired into CI so the next struct change could not ship half-applied.
  # It was not, until 2026-08-05. It needs no chain and no key, only the built artifacts.
  sdk-abi-conformance:
    name: sdk abi conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the three contracts the SDK mirrors
        run: |
          for p in contracts/agent-bond contracts/stream-pay contracts/commit-stake-v2; do
            (cd "$p" && forge build)
          done

      - name: Install SDK dependencies
        run: npm install --no-audit --no-fund

      - name: Compare every SDK fragment to the compiled artifact
        run: node sdk/test.abi-conformance.mjs

  # The MCP server is the Track 4 surface — the tools an agent calls in its own loop — and it
  # had no automated coverage at all until 2026-08-08. That absence, not any single bug, is
  # the finding: `bondwire_commitment` shipped returning "Do not know how to serialize a
  # BigInt" for every id, because nothing outside a human's terminal ever called it.
  #
  # This job speaks JSON-RPC to the real server over stdio: lists the 8 tools and calls the 5
  # that need no key. Verified by control, not by going green — run against the pre-fix server
  # (402aa20^) it fails 3 assertions with that exact BigInt message.
  #
  # No key is set, so the value-moving tools can only be checked for a clean refusal; they
  # cannot sign. It does read the live Arc testnet RPC, deliberately: a mock cannot produce
  # the bigints that broke serialization.
  mcp-smoke:
    name: mcp server surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MCP server dependencies
        working-directory: mcp
        run: npm install --no-audit --no-fund

      - name: Drive the server as a client
        working-directory: mcp
        run: node test.smoke.mjs
