name: static-analysis

# Two jobs:
#   * `static` (Phase-1 primitives: agent-bond, stream-pay, commit-stake) — INFORMATIONAL. These
#     already-audited contracts surface only triaged false-positives (reentrancy closed by the
#     per-entry nonReentrant mutex + trusted-token callees; timestamp/low-level-call by-design,
#     see each STATIC_ANALYSIS / triage). Reports upload as artifacts; the gate is `tests`.
#   * `static-gate-commit-stake-v2` — GATING. The by-design findings are suppressed in a Slither
#     per-instance triage DB (`contracts/commit-stake-v2/slither.db.json`), NOT inline comments —
#     so `src/CommitStakeV2.sol` stays byte-identical to the deployed, exact-match-verified source
#     (see STATIC_ANALYSIS.md). `slither --fail-pedantic` auto-reads the DB: 0 results / exit 0
#     today, RED on a NEW, un-accepted finding (a new instance has a different hash, not in the DB).
#     A real signal, not `slither || true`, and not a global detector exclude.

on:
  push:
  pull_request:

jobs:
  static:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - contracts/agent-bond
          - contracts/stream-pay
          - contracts/commit-stake
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # forge-std is a pinned submodule (v1.16.1) in all four projects — see .gitmodules
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither + solc 0.8.24
        run: |
          pipx install slither-analyzer
          pipx install solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Slither (informational)
        id: slither
        continue-on-error: true
        run: slither . --exclude-dependencies --checklist > slither-report.md 2>&1 || true

      - name: Aderyn (informational)
        continue-on-error: true
        run: npx -y @cyfrin/aderyn@0.6.8 --src src -o aderyn-report.md . || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ strategy.job-index }}
          path: |
            ${{ matrix.project }}/slither-report.md
            ${{ matrix.project }}/aderyn-report.md
          if-no-files-found: ignore

  # GATING Slither for commit-stake-v2. The by-design findings are suppressed by the per-instance
  # triage DB (`slither.db.json`), NOT by in-source `slither-disable` directives —
  # `src/CommitStakeV2.sol` contains zero of those, so it stays byte-identical to the
  # exact-match-verified deployed source (see STATIC_ANALYSIS.md).
  # The DB keys every accepted finding by a CONTENT-DERIVED hash, so it is coupled to the source:
  # any edit under `src/` re-hashes the findings, detaches all 25 suppressions and turns this job
  # red — which is exactly what happened between 2026-08-10 and 2026-09-30.
  # RULE: regenerate the DB in the SAME commit that touches `src/`, and re-accept only the
  # already-triaged detector classes. A finding from a NEW class must be fixed or explicitly
  # reviewed, never silently appended to the DB.
  # Regenerate (non-interactive):
  #   slither . --exclude-dependencies --json results.json
  #   then write the JSON's `.results.detectors` array (the 25 by-design entries) to slither.db.json
  # --fail-pedantic auto-reads the DB: 0 results / exit 0 today, red on any NEW un-accepted finding.
  static-gate-commit-stake-v2:
    name: commit-stake-v2 (gating)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/commit-stake-v2
    steps:
      # forge-std is a pinned submodule (v1.16.1) in all four projects — see .gitmodules
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither + solc 0.8.24
        run: |
          pipx install slither-analyzer
          pipx install solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      # No continue-on-error, no `|| true`: a NEW, un-suppressed finding fails the build.
      - name: Slither (gating, --fail-pedantic)
        run: slither . --exclude-dependencies --fail-pedantic
